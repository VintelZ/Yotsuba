#logo{width:84px;height:84px;background:var(--yo2) center/contain no-repeat;flex:none}
body::before{content:'';position:fixed;left:-16px;bottom:0;width:75vw;max-width:360px;height:60vh;background:var(--yo) left bottom/contain no-repeat;opacity:.2;mix-blend-mode:multiply;z-index:-1;pointer-events:none}
h1{margin:0;font-size:34px;flex:1;font-weight:400}
.btn{background:none;border:4px solid var(--red);color:var(--red);font:inherit;font-size:20px;padding:6px 12px;cursor:pointer;border-radius:4px}
.btn.on{background:var(--red);color:var(--bg)}
hr{border:0;height:10px;background:var(--red);border-radius:6px;margin:8px 12px 14px}
#feed{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 110px;align-items:start}
.card{background:var(--card);border-radius:10px;padding:8px;position:relative;overflow-wrap:anywhere}
.who{display:flex;align-items:center;gap:6px;border-bottom:3px solid var(--red);padding-bottom:4px;font-size:15px}
.av{width:30px;height:30px;border-radius:50%;border:3px solid var(--red);object-fit:cover;flex:none;background:var(--bg)}
.txt{font-family:system-ui,sans-serif;font-size:14px;margin:6px 0;white-space:pre-wrap}
.card img.pic{width:100%;border:3px solid var(--red);border-radius:4px;display:block}
.del{display:none;position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:14px}
.own .del,body.mod .del{display:block}
#fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:68px;height:68px;border-radius:50%;background:var(--red);color:var(--bg);border:0;font-size:44px;line-height:1;cursor:pointer}
.ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;gap:12px;padding:20px;z-index:5;overflow:auto;align-items:center;justify-content:center}
.ov.show{display:flex}.ov>*{max-width:420px;width:100%}
input[type=text],textarea{font:16px system-ui,sans-serif;border:4px solid var(--red);background:var(--card);padding:10px;border-radius:6px;color:#400}
textarea{height:130px;resize:none}
#code{display:flex;gap:8px;justify-content:center}#code input{width:52px;height:60px;text-align:center;font-size:28px;padding:0;text-transform:uppercase}
#pav,#pimg{max-height:120px;object-fit:cover;border:3px solid var(--red);display:none;margin:auto}#pav{width:96px;height:96px;border-radius:50%}
.fl{text-align:center;cursor:pointer}.fl input{display:none}
#err{font:14px system-ui;text-align:center;min-height:18px}
</style></head><body>

<div class="ov" id="rec"><h1 style="text-align:center">Bem-vindo!</h1><label class="fl btn"><img id="pav" alt="">📷 Escolher foto<input type="file" accept="image/*" id="fav"></label><input type="text" id="nm" maxlength="20" placeholder="Nome de usuário"><button class="btn on" id="ent">Entrar</button><div id="err"></div></div>
<div class="ov" id="np"><h1 style="text-align:center">Nova postagem</h1><textarea id="tx" maxlength="2000" placeholder="Escreva algo..."></textarea><label class="fl btn"><img id="pimg" alt="">🖼 Anexar imagem<input type="file" accept="image/*" id="fim"></label><button class="btn on" id="pub">Postar</button><button class="btn" data-x="np">Cancelar</button></div>
<div class="ov" id="mo"><h1 style="text-align:center">Código MOD</h1><div id="code"><input type="text" maxlength="1"><input type="text" maxlength="1"><input type="text" maxlength="1"><input type="text" maxlength="1"><input type="text" maxlength="1"></div><div id="merr" style="text-align:center;font:14px system-ui"></div><button class="btn" data-x="mo">Fechar</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://whjnhbwsflusfhrtrrfa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indoam5oYndzZmx1c2ZocnRycmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MjYwMDgsImV4cCI6MjEwNzAwMjAwOH0.R6VTZldzHKqU-EWlUcDjxZ7bEq1_LW9NM72nITWYiYs';
const $=i=>document.getElementById(i),PG=30;let sb;
try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){setTimeout(()=>alert('Não conectou ao Supabase. Confira a URL e a chave no index.html.\n'+e.message),300)}
let uid,me,modUntil=0,pg=0,avData=null,imData=null;
const show=i=>$(i).classList.add('show'),hide=i=>$(i).classList.remove('show');
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>hide(b.dataset.x));
function shrink(f,max,q){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=u})}
const okImg=s=>typeof s=='string'&&s.startsWith('data:image/');
function pick(inp,img,max,q,set){inp.onchange=async()=>{if(!inp.files[0])return;try{const d=await shrink(inp.files[0],max,q);set(d);img.src=d;img.style.display='block'}catch(e){}}}
pick($('fav'),$('pav'),128,.8,d=>avData=d);pick($('fim'),$('pimg'),900,.7,d=>imData=d);
async function init(){
 let{data:{session}}=await sb.auth.getSession();
 if(!session){const r=await sb.auth.signInAnonymously();if(r.error){alert('Erro: '+r.error.message);return}session=r.data.session}
 uid=session.user.id;
 const{data}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
 me=data;if(!me)show('rec');await modCheck();load(true);setInterval(()=>load(true),10000);setInterval(modTick,20000)}
$('ent').onclick=async()=>{const name=$('nm').value.trim();if(name.length<2){$('err').textContent='Nome precisa de 2+ letras';return}
 const{data,error}=await sb.from('profiles').upsert({id:uid,name,avatar:avData}).select().single();
 if(error){$('err').textContent='Erro: '+error.message;return}me=data;hide('rec')};
function card(p){const d=document.createElement('div');d.className='card'+(p.user_id==uid?' own':'');d.dataset.id=p.id;
 const w=document.createElement('div');w.className='who';const a=document.createElement('img');a.className='av';if(okImg(p.profiles?.avatar))a.src=p.profiles.avatar;
 const n=document.createElement('span');n.textContent=(p.profiles?.name||'???')+'#'+String(p.profiles?.tag||0).padStart(4,'0');w.append(a,n);d.append(w);
 if(p.body){const t=document.createElement('div');t.className='txt';t.textContent=p.body;d.append(t)}
 if(okImg(p.image)){const i=document.createElement('img');i.className='pic';i.src=p.image;d.append(i)}
 const x=document.createElement('button');x.className='del';x.textContent='✕';x.onclick=async()=>{if(!confirm('Apagar post?'))return;const{error}=await sb.from('posts').delete().eq('id',p.id);if(error)alert(error.message);else d.remove()};d.append(x);return d}
async function load(reset){if(reset)pg=0;const{data,error}=await sb.from('posts').select('id,user_id,body,image,created_at,profiles(name,tag,avatar)').order('created_at',{ascending:false}).range(pg*PG,pg*PG+PG-1);
 if(error||!data)return;const f=$('feed');if(reset){const frag=document.createDocumentFragment();data.forEach(p=>frag.append(card(p)));f.replaceChildren(frag)}else data.forEach(p=>f.append(card(p)));
 $('more').style.display=data.length==PG?'inline-block':'none'}
$('more').onclick=()=>{pg++;load(false)};
$('fab').onclick=()=>show('np');
$('pub').onclick=async()=>{const body=$('tx').value.trim();if(!body&&!imData)return;$('pub').disabled=true;
 const{error}=await sb.from('posts').insert({user_id:uid,body,image:imData});$('pub').disabled=false;if(error){alert(error.message);return}
 $('tx').value='';imData=null;$('pimg').style.display='none';hide('np');load(true)};
// MOD
async function modCheck(){const{data}=await sb.rpc('mod_status');modUntil=data?new Date(data).getTime():0;modTick()}
function modTick(){const on=Date.now()<modUntil;document.body.classList.toggle('mod',on);$('modb').classList.toggle('on',on);$('modb').textContent=on?'MOD ✓':'MOD'}
const ci=[...document.querySelectorAll('#code input')];
$('modb').onclick=()=>{if(Date.now()<modUntil){if(confirm('Sair do modo MOD?')){modUntil=0;sb.rpc('mod_status');modTick()}return}ci.forEach(i=>i.value='');$('merr').textContent='';show('mo');ci[0].focus()};
ci.forEach((inp,k)=>{inp.oninput=async()=>{inp.value=inp.value.toUpperCase();if(inp.value&&ci[k+1])ci[k+1].focus();
 const code=ci.map(i=>i.value).join('');if(code.length==5){const{data,error}=await sb.rpc('claim_mod',{code});
 if(error){$('merr').textContent='Muitas tentativas. Espere um pouco.';return}
 if(data){await modCheck();hide('mo')}else{$('merr').textContent='Código errado';ci.forEach(i=>i.value='');ci[0].focus()}}};
 inp.onkeydown=e=>{if(e.key=='Backspace'&&!inp.value&&ci[k-1])ci[k-1].focus()}});
init();
</script></body></html>
